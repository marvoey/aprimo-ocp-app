name: Deployment
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_to_staging:
        type: boolean
        description: Deploy to staging
        default: true

jobs:
  Deploy:
    name: Deploy
    uses: ZaiusInc/odpint-shared-workflows/.github/workflows/deployment-workflow.yml@latest-stable
    secrets: inherit
    with:
      deploy_to_staging: ${{inputs.deploy_to_staging || false}}
      node_version: 22.x
